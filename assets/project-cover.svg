<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="cover-title cover-description">
<title id="cover-title">Gravity and Flight</title>
<desc id="cover-description">Evidence-grounded reasoning for fine-grained remote sensing. Heavy circular contours on warm paper open into rising blue trajectories.</desc>
<rect width="1600" height="520" fill="#FCF1EB"/>
<g fill="#242d2b">
<text x="72" y="57" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="2.6">G&amp;F / RESEARCH</text>
<text x="1528" y="57" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20">EoT-SFT → RTPO</text>
<text x="66" y="187" font-family="Georgia, 'Times New Roman', serif" font-size="120" letter-spacing="-4">Gravity <tspan font-size="100" letter-spacing="-2">&amp;</tspan><tspan dx="15" font-style="italic">Flight.</tspan></text>
<text x="72" y="252" font-family="Arial, Helvetica, sans-serif" font-size="29" letter-spacing="-.3">Evidence-grounded reasoning for fine-grained remote sensing.</text>
</g>
<g transform="translate(0 300) scale(1.111111111 .5)" fill="none">
