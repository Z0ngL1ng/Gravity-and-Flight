<g fill="#3d637c" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle"><text x="444" y="358">Initialize</text><text x="444" y="380">policy</text></g>
<g fill="#242d2b" font-family="Arial, Helvetica, sans-serif" font-size="21">
<text x="516" y="317">Independent generation</text>
<text x="933" y="317">Paired verification</text>
<text x="1297" y="317">Shared advantage</text>
</g>
