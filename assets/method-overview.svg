<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="method-title method-description">
<title id="method-title">Gravity and Flight: two-stage training</title>
<desc id="method-description">Stage one uses Evidence-of-Thought supervised fine-tuning. Stage two, Relational Transfer Policy Optimization, independently generates each response from its own image and a shared question. Matched responses are evaluated with Gravity, Flight and Task Check. A shared pair-level advantage updates both responses. At inference the policy receives one image and one question.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#3d637c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1600" height="850" fill="#FFFCF8"/>
<text x="56" y="72" fill="#242d2b" font-family="Georgia, 'Times New Roman', serif" font-size="44">Two stages. One single-image policy.</text>
<rect x="56" y="122" width="346" height="530" fill="#FCF1EB"/>
