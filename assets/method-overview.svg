<path d="M82 388H376M82 460H376M82 532H376"/>
</g>
<g fill="#8c7161" font-family="Arial, Helvetica, sans-serif" font-size="16">
<text x="82" y="374">01</text><text x="82" y="446">02</text><text x="82" y="518">03</text>
</g>
<text x="82" y="602" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5b625f">Supervised initialization</text>
