<g fill="#242d2b" font-family="Arial, Helvetica, sans-serif" font-size="22"><text x="1302" y="474">One value for</text><text x="1302" y="505">both responses.</text></g>
<path d="M516 598H1516" stroke="#bccbd4" stroke-width="1"/>
<text x="516" y="631" fill="#5b625f" font-family="Arial, Helvetica, sans-serif" font-size="21">A matched pair supplies relational feedback to a single-image policy.</text>
<rect x="56" y="700" width="1488" height="110" fill="#242d2b"/>
<text x="86" y="741" fill="#c4d9e6" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="1.7">AT INFERENCE</text>
<text x="86" y="783" fill="#FCF1EB" font-family="Arial, Helvetica, sans-serif" font-size="31">One image + one question  →  One evidence-grounded answer</text>
</svg>